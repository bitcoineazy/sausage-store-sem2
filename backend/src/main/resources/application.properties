spring.application.name=sausage-store
management.security.enabled=false

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false



# Vault: DB credentials (spring.datasource.username/password) and spring.data.mongodb.uri live in kv/sausage-store.
# Host/port/token come from the environment (Helm chart: SPRING_CLOUD_VAULT_HOST / _PORT / _TOKEN).
spring.cloud.vault.enabled=${SPRING_CLOUD_VAULT_ENABLED:true}
spring.cloud.vault.scheme=http
spring.cloud.vault.host=${SPRING_CLOUD_VAULT_HOST:vault}
spring.cloud.vault.port=${SPRING_CLOUD_VAULT_PORT:8200}
spring.cloud.vault.token=${SPRING_CLOUD_VAULT_TOKEN:}
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=kv
spring.config.import=vault://kv/${spring.application.name}


# Enable Flyway
spring.flyway.enabled=true
flyway.baselineOnMigrate=true

#H2 settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

{{- if .Values.global.vault.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.vault.name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  vault_token: {{ required "global.vault.vaultToken is required (pass --set global.vault.vaultToken=...)" .Values.global.vault.vaultToken | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: {{ .Values.vault.image }}
          # Dev-mode server (in-memory, auto-unsealed) that seeds the backend secrets right after it comes up,
          # so the secrets exist before the backend pod starts (no Helm hook ordering involved).
          command: ["sh", "-c"]
          args:
            - |
              vault server -dev -dev-listen-address=0.0.0.0:{{ .Values.vault.port }} &
              until vault status >/dev/null 2>&1; do sleep 1; done
              vault secrets list -format=json | grep -q '"kv/"' || vault secrets enable -path=kv kv-v2
              vault kv put kv/{{ .Values.vault.secretPath }} \
                spring.datasource.username={{ .Values.vault.secrets.postgresUser | quote }} \
                spring.datasource.password={{ .Values.vault.secrets.postgresPassword | quote }} \
                spring.data.mongodb.uri={{ .Values.vault.secrets.mongodbUri | quote }}
              echo "vault seeded"
              wait
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.vault.name }}
                  key: vault_token
            - name: VAULT_ADDR
              value: http://127.0.0.1:{{ .Values.vault.port }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.vault.name }}
                  key: vault_token
          ports:
            - containerPort: {{ .Values.vault.port }}
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: {{ .Values.vault.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.vault.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.vault.host }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.global.vault.port }}
      targetPort: {{ .Values.vault.port }}
  selector:
    app: vault
{{- end }}

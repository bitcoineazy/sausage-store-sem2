{{- if not .Values.global.vault.enabled }}
---
# Fallback for local installs without Vault. In production the credentials live in Vault.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  postgres_user: {{ .Values.env.postgresUser | quote }}
  postgres_password: {{ .Values.env.postgresPassword | quote }}
{{- end }}
